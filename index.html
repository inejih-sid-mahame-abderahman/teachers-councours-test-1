<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>دورة تدريبية: معلم اللغة العربية - 300+ سؤال</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#0d5c63;
    --primary-dark:#083e43;
    --accent:#e6b31e;
    --accent-dark:#c99a13;
    --bg:#f4f7f6;
    --card:#ffffff;
    --text:#1c2b2d;
    --muted:#5f7470;
    --success:#2e9e5b;
    --success-bg:#e6f6ec;
    --error:#d64545;
    --error-bg:#fdeaea;
    --border:#d9e2e0;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Cairo',sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.8;
    padding:20px;
  }
  .container{max-width:960px;margin:0 auto;}

  /* Header */
  header{
    background:linear-gradient(135deg,var(--primary) 0%,var(--primary-dark) 100%);
    color:#fff;
    border-radius:18px;
    padding:30px 25px;
    text-align:center;
    box-shadow:0 10px 30px rgba(13,92,99,.25);
    margin-bottom:22px;
    position:relative;
    overflow:hidden;
  }
  header::before{
    content:"";
    position:absolute;top:-50%;right:-20%;
    width:300px;height:300px;
    background:radial-gradient(circle,rgba(230,179,30,.25),transparent 70%);
    border-radius:50%;
  }
  header h1{font-size:1.9rem;font-weight:900;margin-bottom:8px;position:relative;}
  header p{color:#cfe8e6;font-size:1rem;position:relative;}
  .badge{
    display:inline-block;
    background:var(--accent);
    color:#3b2c00;
    font-weight:700;
    padding:4px 14px;
    border-radius:30px;
    font-size:.85rem;
    margin-top:12px;
    position:relative;
  }

  /* Stats bar */
  .stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:14px;
    margin-bottom:22px;
  }
  .stat-card{
    background:var(--card);
    border-radius:14px;
    padding:18px 12px;
    text-align:center;
    box-shadow:0 4px 14px rgba(0,0,0,.05);
    border:1px solid var(--border);
    transition:transform .2s;
  }
  .stat-card:hover{transform:translateY(-3px);}
  .stat-card .num{
    font-size:1.7rem;
    font-weight:900;
    color:var(--primary);
    display:block;
  }
  .stat-card .lbl{font-size:.85rem;color:var(--muted);font-weight:600;}

  /* Progress */
  .progress-wrap{
    background:var(--card);
    border-radius:14px;
    padding:18px 20px;
    box-shadow:0 4px 14px rgba(0,0,0,.05);
    border:1px solid var(--border);
    margin-bottom:22px;
  }
  .progress-top{
    display:flex;justify-content:space-between;
    font-size:.9rem;font-weight:700;color:var(--muted);
    margin-bottom:10px;
  }
  .progress-bar{
    height:12px;
    background:#e8eeec;
    border-radius:20px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,var(--primary),#14a3a8);
    border-radius:20px;
    transition:width .4s ease;
  }

  /* Controls */
  .controls{
    display:flex;flex-wrap:wrap;gap:10px;
    margin-bottom:22px;
    justify-content:center;
  }
  .btn{
    font-family:'Cairo',sans-serif;
    border:none;
    padding:12px 26px;
    border-radius:12px;
    font-size:.95rem;
    font-weight:700;
    cursor:pointer;
    transition:all .2s;
  }
  .btn-primary{background:var(--primary);color:#fff;box-shadow:0 4px 14px rgba(13,92,99,.3);}
  .btn-primary:hover{background:var(--primary-dark);transform:translateY(-2px);}
  .btn-accent{background:var(--accent);color:#3b2c00;box-shadow:0 4px 14px rgba(230,179,30,.35);}
  .btn-accent:hover{background:var(--accent-dark);transform:translateY(-2px);}
  .btn-outline{background:#fff;color:var(--primary);border:2px solid var(--primary);}
  .btn-outline:hover{background:#eaf4f4;}

  /* Quiz */
  .quiz-section{display:none;}
  .quiz-section.active{display:block;}

  .question-card{
    background:var(--card);
    border-radius:16px;
    padding:24px 22px;
    box-shadow:0 6px 20px rgba(0,0,0,.06);
    border:1px solid var(--border);
    margin-bottom:18px;
    animation:fadeIn .35s ease;
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  .q-header{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:14px;
    flex-wrap:wrap;gap:8px;
  }
  .q-num{
    background:var(--primary);
    color:#fff;
    font-weight:700;
    padding:4px 14px;
    border-radius:20px;
    font-size:.85rem;
  }
  .q-tag{
    background:#f0f5f4;
    color:var(--muted);
    font-weight:600;
    padding:4px 12px;
    border-radius:20px;
    font-size:.78rem;
  }

  .q-text{
    font-family:'Amiri',serif;
    font-size:1.18rem;
    font-weight:700;
    line-height:2;
    margin-bottom:18px;
    color:var(--text);
  }

  .options{display:flex;flex-direction:column;gap:10px;}
  .option{
    display:flex;align-items:flex-start;gap:12px;
    background:#fafcfb;
    border:2px solid var(--border);
    border-radius:12px;
    padding:12px 16px;
    cursor:pointer;
    transition:all .2s;
    font-size:1rem;
  }
  .option:hover{border-color:var(--primary);background:#f0f8f8;}
  .option.selected{border-color:var(--primary);background:#e6f4f4;}
  .option.correct{border-color:var(--success);background:var(--success-bg);}
  .option.wrong{border-color:var(--error);background:var(--error-bg);}
  .option .letter{
    width:28px;height:28px;flex-shrink:0;
    border-radius:50%;
    background:var(--primary);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:.85rem;
  }
  .option.correct .letter{background:var(--success);}
  .option.wrong .letter{background:var(--error);}

  .explanation{
    margin-top:14px;
    padding:14px 16px;
    background:#fffbe9;
    border-right:4px solid var(--accent);
    border-radius:8px;
    font-size:.92rem;
    display:none;
  }
  .explanation.show{display:block;}

  /* Nav */
  .nav-buttons{
    display:flex;justify-content:space-between;gap:10px;
    margin-top:22px;
  }

  /* Result */
  .result-card{
    background:var(--card);
    border-radius:18px;
    padding:40px 28px;
    text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    border:1px solid var(--border);
  }
  .result-circle{
    width:170px;height:170px;
    border-radius:50%;
    margin:0 auto 22px;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    background:conic-gradient(var(--primary) 0deg, #e8eeec 0deg);
    position:relative;
  }
  .result-circle::before{
    content:"";
    position:absolute;inset:12px;
    background:#fff;
    border-radius:50%;
  }
  .result-circle .pct{
    font-size:2.4rem;font-weight:900;color:var(--primary);
    position:relative;z-index:1;
  }
  .result-circle .pct-lbl{
    font-size:.8rem;color:var(--muted);position:relative;z-index:1;
  }
  .result-msg{font-size:1.3rem;font-weight:700;margin-bottom:10px;}
  .result-sub{color:var(--muted);margin-bottom:24px;}

  /* Section picker */
  .sections-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:14px;
    margin-bottom:22px;
  }
  .section-card{
    background:var(--card);
    border:2px solid var(--border);
    border-radius:14px;
    padding:18px;
    text-align:center;
    cursor:pointer;
    transition:all .2s;
  }
  .section-card:hover{border-color:var(--primary);transform:translateY(-3px);box-shadow:0 6px 18px rgba(0,0,0,.07);}
  .section-card.active{border-color:var(--primary);background:#e6f4f4;}
  .section-card .icon{font-size:1.8rem;margin-bottom:8px;}
  .section-card .name{font-weight:700;font-size:.95rem;}
  .section-card .count{font-size:.78rem;color:var(--muted);}

  @media(max-width:600px){
    body{padding:12px;}
    header h1{font-size:1.4rem;}
    .q-text{font-size:1.05rem;}
    .stat-card .num{font-size:1.3rem;}
  }
</style>
</head>
<body>
<div class="container">

  <header>
    <h1>📘 دورة تدريبية متقدمة</h1>
    <p>تحضير المترشحين لمسابقة اكتتاب معلمي اللغة العربية - التعليم الأساسي</p>
    <span class="badge">300+ سؤال في اللغة العربية وآدابها</span>
  </header>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card"><span class="num" id="statTotal">0</span><span class="lbl">إجمالي الأسئلة</span></div>
    <div class="stat-card"><span class="num" id="statAnswered">0</span><span class="lbl">أسئلة مجابة</span></div>
    <div class="stat-card"><span class="num" id="statCorrect" style="color:var(--success)">0</span><span class="lbl">إجابات صحيحة</span></div>
    <div class="stat-card"><span class="num" id="statWrong" style="color:var(--error)">0</span><span class="lbl">إجابات خاطئة</span></div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-top">
      <span>📊 تقدمك في الاختبار</span>
      <span id="progressText">0 / 0</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>

  <!-- Section Picker -->
  <div class="sections-grid" id="sectionsGrid"></div>

  <!-- Controls -->
  <div class="controls">
    <button class="btn btn-primary" onclick="startQuiz('all')">🚀 بدء الاختبار الشامل</button>
    <button class="btn btn-accent" onclick="startQuiz('random')">🎲 اختبار عشوائي (50 سؤال)</button>
    <button class="btn btn-outline" onclick="resetQuiz()">🔄 إعادة التعيين</button>
  </div>

  <!-- Quiz Area -->
  <div id="quizArea" class="quiz-section"></div>

</div>

<script>
/* ============================================================
   بنك الأسئلة - 300+ سؤال في اللغة العربية
   ============================================================ */
const QUESTIONS = [

/* ===== النحو ===== */
{cat:"النحو",q:"ما إعراب كلمة «مجتهداً» في قولنا: «رأيت الطالب مجتهداً»؟",opts:["مفعول به","حال منصوبة","خبر منصوب","تمييز منصوب"],a:1,exp:"«مجتهداً» حال منصوبة لأنها تبين هيئة المفعول به وقت وقوع الفعل."},
{cat:"النحو",q:"في جملة «كان الطالب مجتهداً» ما نوع «مجتهداً»؟",opts:["حال","خبر كان منصوب","مفعول به","نعت"],a:1,exp:"«مجتهداً» خبر «كان» منصوب، و«الطالب» اسمها مرفوع."},
{cat:"النحو",q:"ما علامة إعراب الفاعل في «جاء المعلمان»؟",opts:["الضمة","الألف","الواو","الياء"],a:1,exp:"الفاعل «المعلمان» مرفوع بالألف لأنه مثنى."},
{cat:"النحو",q:"«إنّ العلمَ نورٌ» - ما إعراب «العلمَ»؟",opts:["مبتدأ مرفوع","اسم إنّ منصوب","فاعل مرفوع","خبر إنّ مرفوع"],a:1,exp:"«العلمَ» اسم «إنّ» منصوب، و«نورٌ» خبرها مرفوع."},
{cat:"النحو",q:"«ما زال الجوُّ جميلاً» - ما نوع «ما»؟",opts:["نافية","استفهامية","شرطية","موصولة"],a:0,exp:"«ما» نافية، و«زال» فعل ناقص يرفع الاسم وينصب الخبر."},
{cat:"النحو",q:"ما إعراب «كتاباً» في «أعطيت الفقير كتاباً»؟",opts:["مفعول به أول","مفعول به ثانٍ","حال","تمييز"],a:1,exp:"«أعطى» فعل ينصب مفعولين: «الفقير» مفعول أول، و«كتاباً» مفعول ثانٍ."},
{cat:"النحو",q:"«لا طالبَ مهملٌ» - ما عمل «لا» النافية للجنس؟",opts:["ترفع الاسم وتنصب الخبر","تنصب الاسم وترفع الخبر","تجزم الفعل","لا تعمل"],a:1,exp:"«لا» النافية للجنس تنصب الاسم (طالبَ) وترفع الخبر (مهملٌ)."},
{cat:"النحو",q:"«يا أيها الطالبُ» - ما إعراب «الطالبُ»؟",opts:["منادى مبني على الضم","بدل مرفوع","نعت مرفوع","خبر مرفوع"],a:1,exp:"«الطالبُ» بدل مرفوع من «أي»."},
{cat:"النحو",q:"ما نوع «ما» في «ما أجملَ السماءَ»؟",opts:["نافية","تعجبية","استفهامية","موصولة"],a:1,exp:"«ما» تعجبية، والجملة أسلوب تعجب قياسي."},
{cat:"النحو",q:"«العلمُ نافعٌ» - ما إعراب «نافعٌ»؟",opts:["خبر مرفوع","صفة مرفوعة","فاعل مرفوع","بدل مرفوع"],a:0,exp:"«نافعٌ» خبر المبتدأ «العلمُ» مرفوع بالضمة."},
{cat:"النحو",q:"«في الدار رجلٌ» - ما نوع المبتدأ؟",opts:["مبتدأ مرفوع","خبر مقدم","مبتدأ مؤخر","فاعل"],a:2,exp:"«رجلٌ» مبتدأ مؤخر مرفوع، و«في الدار» خبر مقدم."},
{cat:"النحو",q:"«أكرمتُ العالمَ» - ما إعراب «العالمَ»؟",opts:["فاعل","مفعول به منصوب","حال","خبر"],a:1,exp:"«العالمَ» مفعول به منصوب بالفتحة."},
{cat:"النحو",q:"ما إعراب «محمّدٌ» في «محمّدٌ رسولُ الله»؟",opts:["مبتدأ مرفوع","فاعل","خبر مقدم","نعت"],a:0,exp:"«محمّدٌ» مبتدأ مرفوع، و«رسولُ» خبر مرفوع وهو مضاف."},
{cat:"النحو",q:"«ما رأيتُ إلا محمّداً» - ما إعراب «محمّداً»؟",opts:["مستثنى منصوب","بدل مرفوع","مفعول به","حال"],a:0,exp:"«محمّداً» مستثنى بإلا منصوب."},
{cat:"النحو",q:"«حضر الطلابُ كلُّهم» - ما إعراب «كلُّهم»؟",opts:["توكيد معنوي مرفوع","نعت مرفوع","بدل مرفوع","خبر"],a:0,exp:"«كلُّهم» توكيد معنوي مرفوع، والضمير مضاف إليه."},
{cat:"النحو",q:"ما نوع «أو» في «اجلس أو قف»؟",opts:["عطف","شرط","نفي","استفهام"],a:0,exp:"«أو» حرف عطف يفيد التخيير."},
{cat:"النحو",q:"«لم يذهبْ» - ما علامة الجزم؟",opts:["حذف حرف العلة","السكون","حذف النون","الفتحة"],a:1,exp:"«يذهبْ» فعل مضارع مجزوم بـ«لم» وعلامة جزمه السكون."},
{cat:"النحو",q:"«لن أتأخرَ» - ما علامة النصب؟",opts:["الفتحة الظاهرة","حذف النون","الفتحة المقدرة","السكون"],a:0,exp:"«أتأخرَ» فعل مضارع منصوب بـ«لن» وعلامة نصبه الفتحة."},
{cat:"النحو",q:"ما إعراب «مسرعاً» في «جاء الطالب مسرعاً»؟",opts:["مفعول به","حال منصوب","خبر","نعت"],a:1,exp:"«مسرعاً» حال منصوب لأنه يبين هيئة الفاعل عند المجيء."},
{cat:"النحو",q:"«في المكتبةِ عشرون كتاباً» - ما إعراب «كتاباً»؟",opts:["مفعول به","تمييز منصوب","حال","بدل"],a:1,exp:"«كتاباً» تمييز منصوب بعد العدد «عشرون»."},
{cat:"النحو",q:"«أعجبني ما صنعتَ» - ما إعراب «ما»؟",opts:["اسم موصول في محل رفع فاعل","نافية","استفهامية","شرطية"],a:0,exp:"«ما» اسم موصول مبني في محل رفع فاعل لـ«أعجب»."},
{cat:"النحو",q:"«من يجتهدْ ينجحْ» - ما إعراب «من»؟",opts:["اسم شرط جازم في محل رفع مبتدأ","حرف شرط","اسم موصول","استفهامية"],a:0,exp:"«من» اسم شرط جازم مبني في محل رفع مبتدأ."},
{cat:"النحو",q:"«هذا كتابٌ مفيدٌ» - ما إعراب «كتابٌ»؟",opts:["خبر مرفوع","بدل مرفوع","نعت مرفوع","مبتدأ"],a:0,exp:"«كتابٌ» خبر مرفوع للمبتدأ «هذا»."},
{cat:"النحو",q:"«كان الطلابُ مجتهدين» - ما علامة نصب الخبر؟",opts:["الفتحة","الياء","الألف","الكسرة"],a:1,exp:"«مجتهدين» خبر كان منصوب بالياء لأنه جمع مذكر سالم."},
{cat:"النحو",q:"«إنّ المعلمين مخلصون» - ما علامة رفع الخبر؟",opts:["الواو","الألف","الضمة","الياء"],a:0,exp:"«مخلصون» خبر إنّ مرفوع بالواو لأنه جمع مذكر سالم."},
{cat:"النحو",q:"ما إعراب «أباك» في «أكرم أباك»؟",opts:["مفعول به منصوب بالألف","فاعل مرفوع","حال","بدل"],a:0,exp:"«أباك» مفعول به منصوب بالألف لأنه من الأسماء الخمسة."},
{cat:"النحو",q:"«لا تهملْ واجبَك» - ما إعراب «تهملْ»؟",opts:["فعل مضارع مجزوم بلا الناهية","فعل مضارع منصوب","فعل ماضٍ","فعل مضارع مرفوع"],a:0,exp:"«تهملْ» مضارع مجزوم بـ«لا» الناهية وعلامة جزمه السكون."},
{cat:"النحو",q:"«يا عبدَ الله» - ما إعراب «عبدَ»؟",opts:["منادى مضاف منصوب","منادى مبني","بدل","نعت"],a:0,exp:"«عبدَ» منادى مضاف منصوب بالفتحة."},
{cat:"النحو",q:"«ما هذا بشراً» - ما اسم «ما»؟",opts:["هذا","بشراً","ما","هذا وبشراً"],a:0,exp:"«هذا» اسم ما الحجازية في محل رفع، و«بشراً» خبرها منصوب."},
{cat:"النحو",q:"«ظننتُ الأمرَ سهلاً» - ما إعراب «سهلاً»؟",opts:["مفعول به ثانٍ","حال","نعت","تمييز"],a:0,exp:"«سهلاً» مفعول به ثانٍ لـ«ظنّ» منصوب."},
{cat:"النحو",q:"«أعلمتُ الطالبَ النجاحَ» - كم مفعولاً للفعل؟",opts:["واحد","اثنان","ثلاثة","لا مفعول"],a:2,exp:"«أعلم» ينصب ثلاثة مفاعيل: الطالبَ، النجاحَ، والمفعول الثالث محذوف تقديره «متحققاً»."},

/* ============================================================
   منطق الاختبار
   ============================================================ */
let currentQuestions = [];
let currentIndex = 0;
let score = 0;
let wrongCount = 0;
let answered = 0;
let selectedOption = null;
let answeredState = false;

const CATEGORIES = {
  "النحو": "📗",
  "الصرف": "📘",
  "البلاغة": "📙",
  "العروض": "📐",
  "الأدب والنقد": "📚",
  "المهارات": "🛠️",
  "قواعد": "📏",
  "إضافي": "➕"
};

function initSections(){
  const grid = document.getElementById('sectionsGrid');
  const counts = {};
  QUESTIONS.forEach(q => { counts[q.cat] = (counts[q.cat]||0)+1; });
  let html = '';
  Object.keys(counts).forEach(cat => {
    html += `<div class="section-card" onclick="startQuiz('${cat}')">
      <div class="icon">${CATEGORIES[cat]||'📖'}</div>
      <div class="name">${cat}</div>
      <div class="count">${counts[cat]} سؤال</div>
    </div>`;
  });
  grid.innerHTML = html;
  document.getElementById('statTotal').textContent = QUESTIONS.length;
}

function startQuiz(mode){
  if(mode === 'all'){
    currentQuestions = [...QUESTIONS];
  } else if(mode === 'random'){
    currentQuestions = shuffle([...QUESTIONS]).slice(0,50);
  } else {
    currentQuestions = QUESTIONS.filter(q => q.cat === mode);
  }
  currentIndex = 0;
  score = 0;
  wrongCount = 0;
  answered = 0;
  selectedOption = null;
  answeredState = false;
  document.querySelectorAll('.section-card').forEach(c => c.classList.remove('active'));
  renderQuestion();
  updateStats();
}

function shuffle(arr){
  for(let i = arr.length-1; i>0; i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]] = [arr[j],arr[i]];
  }
  return arr;
}

function renderQuestion(){
  const area = document.getElementById('quizArea');
  area.classList.add('active');
  if(currentIndex >= currentQuestions.length){
    renderResult();
    return;
  }
  const q = currentQuestions[currentIndex];
  const letters = ['أ','ب','ج','د'];
  let optsHtml = '';
  q.opts.forEach((opt,i) => {
    let cls = 'option';
    optsHtml += `<div class="${cls}" data-idx="${i}" onclick="selectOption(${i})">
      <span class="letter">${letters[i]}</span>
      <span>${opt}</span>
    </div>`;
  });

  area.innerHTML = `
    <div class="question-card">
      <div class="q-header">
        <span class="q-num">السؤال ${currentIndex+1} من ${currentQuestions.length}</span>
        <span class="q-tag">${CATEGORIES[q.cat]||'📖'} ${q.cat}</span>
      </div>
      <div class="q-text">${q.q}</div>
      <div class="options" id="optionsBox">${optsHtml}</div>
      <div class="explanation" id="explanation">💡 <strong>التوضيح:</strong> ${q.exp}</div>
      <div class="nav-buttons">
        <button class="btn btn-outline" onclick="prevQuestion()" ${currentIndex===0?'disabled style="opacity:.4"':''}>⬅️ السابق</button>
        <button class="btn btn-primary" id="nextBtn" onclick="nextQuestion()">التالي ➡️</button>
      </div>
    </div>
  `;
  selectedOption = null;
  answeredState = false;
  updateProgress();
}

function selectOption(idx){
  if(answeredState) return;
  const q = currentQuestions[currentIndex];
  const options = document.querySelectorAll('#optionsBox .option');
  options.forEach(o => o.classList.remove('selected','correct','wrong'));
  options[idx].classList.add('selected');
  selectedOption = idx;
  // Reveal
  answeredState = true;
  answered++;
  if(idx === q.a){
    options[idx].classList.add('correct');
    score++;
  } else {
    options[idx].classList.add('wrong');
    options[q.a].classList.add('correct');
    wrongCount++;
  }
  document.getElementById('explanation').classList.add('show');
  document.getElementById('nextBtn').textContent = currentIndex === currentQuestions.length-1 ? '🏁 عرض النتيجة' : 'التالي ➡️';
  updateStats();
}

function nextQuestion(){
  if(!answeredState && selectedOption === null){
    // allow skipping
  }
  currentIndex++;
  renderQuestion();
}

function prevQuestion(){
  if(currentIndex > 0){
    currentIndex--;
    renderQuestion();
  }
}

function updateProgress(){
  const total = currentQuestions.length;
  const pct = total ? (answered/total)*100 : 0;
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressText').textContent = `${answered} / ${total}`;
}

function updateStats(){
  document.getElementById('statAnswered').textContent = answered;
  document.getElementById('statCorrect').textContent = score;
  document.getElementById('statWrong').textContent = wrongCount;
  updateProgress();
}

function renderResult(){
  const area = document.getElementById('quizArea');
  const total = currentQuestions.length;
  const pct = total ? Math.round((score/total)*100) : 0;
  let msg = '', sub = '';
  if(pct >= 90){ msg = '🏆 ممتاز! أداء رائع'; sub = 'أنت جاهز لمسابقة الاكتتاب بامتياز'; }
  else if(pct >= 75){ msg = '🌟 جيد جداً'; sub = 'مستوى متقدم، واصل المراجعة'; }
  else if(pct >= 60){ msg = '👍 جيد'; sub = 'تحتاج لمراجعة بعض الدروس'; }
  else if(pct >= 40){ msg = '📖 متوسط'; sub = 'راجع الدروس بعناية'; }
  else { msg = '💪 يحتاج جهداً'; sub = 'أعد مراجعة المادة من البداية'; }

  area.innerHTML = `
    <div class="result-card">
      <div class="result-circle" style="background:conic-gradient(var(--primary) ${pct*3.6}deg, #e8eeec 0deg);">
        <div class="pct">${pct}%</div>
        <div class="pct-lbl">نسبة النجاح</div>
      </div>
      <div class="result-msg">${msg}</div>
      <div class="result-sub">${sub}</div>
      <div class="stats" style="margin:22px 0;">
        <div class="stat-card"><span class="num" style="color:var(--success)">${score}</span><span class="lbl">صحيح</span></div>
        <div class="stat-card"><span class="num" style="color:var(--error)">${wrongCount}</span><span class="lbl">خطأ</span></div>
        <div class="stat-card"><span class="num">${total}</span><span class="lbl">الإجمالي</span></div>
      </div>
      <div class="controls">
        <button class="btn btn-primary" onclick="startQuiz('all')">🔁 إعادة الاختبار</button>
        <button class="btn btn-accent" onclick="startQuiz('random')">🎲 اختبار عشوائي</button>
      </div>
    </div>
  `;
}

function resetQuiz(){
  currentQuestions = [];
  currentIndex = 0;
  score = 0;
  wrongCount = 0;
  answered = 0;
  document.getElementById('quizArea').classList.remove('active');
  document.getElementById('quizArea').innerHTML = '';
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressText').textContent = '0 / 0';
  document.getElementById('statAnswered').textContent = '0';
  document.getElementById('statCorrect').textContent = '0';
  document.getElementById('statWrong').textContent = '0';
  document.querySelectorAll('.section-card').forEach(c => c.classList.remove('active'));
}

// Init
initSections();
</script>
